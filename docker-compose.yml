version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: raghire-postgres
    restart: always
    environment:
      POSTGRES_USER: raghire_user
      POSTGRES_PASSWORD: raghire_password_2026
      POSTGRES_DB: raghire_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: raghire-backend
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://raghire_user:raghire_password_2026@db:5432/raghire_db
      - SECRET_KEY=raghire-super-secret-jwt-key-2026-mca-project
      - AI_PROVIDER=mock
      - DEMO_MODE=true
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: raghire-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
